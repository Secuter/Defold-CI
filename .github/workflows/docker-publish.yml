name: Docker Build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even when version is unchanged or previously failed"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */1 * * *"

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "defold-build"
  cancel-in-progress: false

env:
  REGISTRY: docker.io

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.defold-version.outputs.version_changed }}
      latest_version: ${{ steps.defold-version.outputs.latest_version }}
      latest_version_sha1: ${{ steps.defold-version.outputs.latest_version_sha1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check version
        id: defold-version
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          curl -sSL https://d.defold.com/stable/info.json -o latest_info.json
          latest_version=$(jq -r .version latest_info.json)
          latest_version_sha1=$(jq -r .sha1 latest_info.json)
          echo "latest_version=$latest_version" >> $GITHUB_OUTPUT
          echo "latest_version_sha1=$latest_version_sha1" >> $GITHUB_OUTPUT

          if [ -f "info.json" ]; then
            current_version=$(jq -r .version info.json)
          else
            current_version=""
          fi

          failed_version=""
          failed_result=""
          if [ -f "build-status.json" ]; then
            failed_version=$(jq -r '.last_attempted_version // ""' build-status.json)
            failed_result=$(jq -r '.last_attempt_result // ""' build-status.json)
          fi

          echo "Current version: $current_version"
          echo "Latest version: $latest_version"
          echo "Last attempted version: $failed_version"
          echo "Last attempt result: $failed_result"

          if [ "$current_version" != "$latest_version" ]; then
            if [ "$failed_version" = "$latest_version" ] && [ "$failed_result" = "failure" ] && [ "$FORCE_REBUILD" != "true" ]; then
              echo "Latest version already failed. Waiting for manual force rebuild."
              echo "version_changed=false" >> $GITHUB_OUTPUT
            else
              echo "Version changed."
              echo "version_changed=true" >> $GITHUB_OUTPUT
            fi
          elif [ "$FORCE_REBUILD" = "true" ]; then
            echo "Manual force rebuild requested."
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged."
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  debug:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Debug output
        shell: bash
        run: |
          echo "Version changed: ${{ needs.check-version.outputs.version_changed }}"
          echo "Latest version: ${{ needs.check-version.outputs.latest_version }}"

  build:
    runs-on: ubuntu-latest
    needs: check-version
    if: ${{ needs.check-version.outputs.version_changed == 'true' }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge with sigstore
      id-token: write
    env:
      VERSION: ${{ needs.check-version.outputs.latest_version }}
      VERSION_SHA1: ${{ needs.check-version.outputs.latest_version_sha1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get repository name and version
        shell: bash
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      # Install the cosign tool to sign and verify container images
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      # Set up BuildKit Docker container builder
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login Docker registry
      # https://github.com/docker/login-action
      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        env:
          TAGS: ${{ env.IMAGE_NAME }}:v${{ env.VERSION }},${{ env.IMAGE_NAME }}:latest
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          # labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEFOLD_VERSION=${{ env.VERSION }}
            DEFOLD_VERSION_SHA1=${{ env.VERSION_SHA1 }}

      # Sign the resulting Docker image digest
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  update-version:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: ${{ needs.check-version.outputs.version_changed == 'true' && needs.build.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update tracked files on success
        shell: bash
        run: |
          cat > info.json <<EOF
          {"version": "${{ needs.check-version.outputs.latest_version }}", "sha1": "${{ needs.check-version.outputs.latest_version_sha1 }}"}
          EOF

          cat > build-status.json <<EOF
          {"last_attempted_version": "${{ needs.check-version.outputs.latest_version }}", "last_attempt_result": "success", "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF

      - name: Commit updated tracking files
        shell: bash
        run: |
          if git diff --quiet -- info.json build-status.json; then
            echo "No tracking file changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add info.json build-status.json
          git commit -m "Update version to ${{ needs.check-version.outputs.latest_version }}"
          git push

  mark-failure:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: ${{ needs.check-version.outputs.version_changed == 'true' && needs.build.result == 'failure' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Record failed build attempt
        shell: bash
        run: |
          cat > build-status.json <<EOF
          {"last_attempted_version": "${{ needs.check-version.outputs.latest_version }}", "last_attempt_result": "failure", "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF

      - name: Commit failed build status
        shell: bash
        run: |
          if git diff --quiet -- build-status.json; then
            echo "No build status changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.json
          git commit -m "Record failed build for ${{ needs.check-version.outputs.latest_version }}"
          git push
